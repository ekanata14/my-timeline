<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roadmap 2027: Skripsi, S2, & Karir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        akademik: '#3b82f6', // blue-500
                        beasiswa: '#a855f7', // purple-500
                        karir: '#10b981',    // emerald-500
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; overflow-x: hidden; }
        /* Timeline line for desktop */
        @media (min-width: 768px) {
            .timeline-line::before {
                content: '';
                position: absolute;
                top: 0; left: 50%; width: 4px; height: 100%;
                background-color: #334155; transform: translateX(-50%);
            }
        }
        /* Timeline line for mobile */
        @media (max-width: 767px) {
            .timeline-line::before {
                content: '';
                position: absolute;
                top: 0; left: 24px; width: 4px; height: 100%;
                background-color: #334155;
            }
        }
        .modal-enter { opacity: 0; transform: scale(0.95); }
        .modal-enter-active { opacity: 1; transform: scale(1); transition: opacity 300ms, transform 300ms; }
        .modal-leave { opacity: 1; transform: scale(1); }
        .modal-leave-active { opacity: 0; transform: scale(0.95); transition: opacity 300ms, transform 300ms; }
    </style>
</head>
<body class="antialiased min-h-screen pb-20">

    <header class="pt-16 pb-8 px-6 text-center max-w-4xl mx-auto">
        <h1 class="text-4xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-purple-400 to-emerald-400 mb-4">
            Roadmap 2026 - 2027
        </h1>
        <p class="text-gray-400 text-lg mb-8">Pemetaan strategis menuju Wisuda, Beasiswa S2, dan Karir IT / CPNS.</p>
        
        <div class="flex flex-wrap justify-center gap-3" id="filters">
            <button data-filter="all" class="filter-btn px-5 py-2 rounded-full font-semibold text-sm transition-all bg-gray-700 text-white hover:bg-gray-600 ring-2 ring-gray-400">Semua</button>
            <button data-filter="akademik" class="filter-btn px-5 py-2 rounded-full font-semibold text-sm transition-all bg-gray-800 text-gray-300 hover:text-white border border-blue-500 hover:bg-blue-600/20">🎓 Akademik</button>
            <button data-filter="beasiswa" class="filter-btn px-5 py-2 rounded-full font-semibold text-sm transition-all bg-gray-800 text-gray-300 hover:text-white border border-purple-500 hover:bg-purple-600/20">🌍 Beasiswa S2</button>
            <button data-filter="karir" class="filter-btn px-5 py-2 rounded-full font-semibold text-sm transition-all bg-gray-800 text-gray-300 hover:text-white border border-emerald-500 hover:bg-emerald-600/20">💼 Karir</button>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 relative mt-8">
        <div id="timeline-container" class="timeline-line relative w-full">
            <!-- Timeline items injected by JS -->
        </div>
    </main>

    <!-- Modal -->
    <div id="modal-backdrop" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4 transition-opacity duration-300 opacity-0">
        <div id="modal-content" class="bg-gray-800 rounded-2xl w-full max-w-2xl shadow-2xl overflow-hidden transform scale-95 transition-transform duration-300 flex flex-col max-h-[90vh]">
            <div id="modal-header" class="p-6 border-b border-gray-700 flex justify-between items-start">
                <div>
                    <span id="modal-category" class="text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full mb-2 inline-block"></span>
                    <h2 id="modal-title" class="text-2xl font-bold text-white mt-2"></h2>
                    <p id="modal-date" class="text-gray-400 text-sm mt-1"></p>
                </div>
                <button id="close-modal" class="text-gray-400 hover:text-white transition-colors bg-gray-700 hover:bg-gray-600 rounded-full w-8 h-8 flex items-center justify-center">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modal-body" class="p-6 overflow-y-auto custom-scrollbar text-gray-300 leading-relaxed space-y-4">
                <!-- Content injected by JS -->
            </div>
        </div>
    </div>

    <script>
        const timelineData = [
            {
                id: 1,
                date: "November 2026",
                title: "Ujian Proposal Skripsi",
                category: "akademik",
                icon: "fa-book-open",
                color: "bg-blue-500",
                textColor: "text-blue-400",
                summary: "Fokus pada integrasi IoT Wheelchair & pengajuan bab awal.",
                details: `
                    <h3 class="text-lg font-semibold text-white">Target Utama:</h3>
                    <ul class="list-disc pl-5 space-y-2 mb-4">
                        <li>Menyelesaikan purwarupa integrasi modul ESP32, sensor MPU6050, dan GPS untuk kursi roda.</li>
                        <li>Memastikan transmisi data ke dashboard web berjalan lancar.</li>
                        <li>Bimbingan intensif dan pendaftaran Ujian Proposal dengan Prof. Evi, Pak Djoko, dan Bu Anitha.</li>
                    </ul>
                    <h3 class="text-lg font-semibold text-white">Resource Penting:</h3>
                    <ul class="space-y-2">
                        <li><a href="https://randomnerdtutorials.com/" target="_blank" class="text-blue-400 hover:underline"><i class="fas fa-external-link-alt text-xs mr-1"></i> Referensi ESP32 & IoT</a></li>
                    </ul>
                `
            },
            {
                id: 2,
                date: "Januari 2027",
                title: "IELTS Prep & LPDP Tahap 1",
                category: "beasiswa",
                icon: "fa-globe",
                color: "bg-purple-500",
                textColor: "text-purple-400",
                summary: "Persiapan bahasa dan riset beasiswa tahap awal.",
                details: `
                    <h3 class="text-lg font-semibold text-white">Target Utama:</h3>
                    <ul class="list-disc pl-5 space-y-2 mb-4">
                        <li>Mulai belajar intensif IELTS/TOEFL (Target IELTS minimal 6.5).</li>
                        <li>Mempelajari buku panduan LPDP Tahap 1 sebagai pemanasan atau mengincar LoA Conditional.</li>
                        <li>Menyusun draf awal Motivation Letter (Fokus pada portofolio e-Rehab dan sistem skala nasional).</li>
                    </ul>
                    <h3 class="text-lg font-semibold text-white">Tautan Penting:</h3>
                    <ul class="space-y-2">
                        <li><a href="https://lpdp.kemenkeu.go.id/" target="_blank" class="text-purple-400 hover:underline"><i class="fas fa-external-link-alt text-xs mr-1"></i> Website Resmi LPDP Kemenkeu</a></li>
                        <li><a href="https://www.ielts.org/" target="_blank" class="text-purple-400 hover:underline"><i class="fas fa-external-link-alt text-xs mr-1"></i> Info & Pendaftaran IELTS</a></li>
                    </ul>
                `
            },
            {
                id: 3,
                date: "Februari 2027",
                title: "Seminar Terbuka & Sidang Skripsi",
                category: "akademik",
                icon: "fa-gavel",
                color: "bg-blue-500",
                textColor: "text-blue-400",
                summary: "Finalisasi hardware, dashboard, dan presentasi akhir.",
                details: `
                    <h3 class="text-lg font-semibold text-white">Target Utama:</h3>
                    <ul class="list-disc pl-5 space-y-2 mb-4">
                        <li>Pengujian final sistem pemantauan kursi roda.</li>
                        <li>Melaksanakan Seminar Hasil / Seminar Terbuka.</li>
                        <li>Menghadapi Sidang Skripsi. Segera eksekusi revisi agar SKL (Surat Keterangan Lulus) cepat terbit.</li>
                    </ul>
                `
            },
            {
                id: 4,
                date: "Maret - April 2027",
                title: "Deadline AAS & Persiapan Karir",
                category: "beasiswa", // Primary for visual, but holds dual info
                icon: "fa-paper-plane",
                color: "bg-gradient-to-r from-purple-500 to-emerald-500",
                textColor: "text-purple-400",
                summary: "Submit beasiswa AAS dan memoles CV untuk posisi Tech.",
                details: `
                    <div class="grid md:grid-cols-2 gap-6">
                        <div>
                            <h3 class="text-lg font-semibold text-purple-400 mb-2">Jalur Beasiswa (AAS)</h3>
                            <p class="text-sm mb-3">Pendaftaran Australia Awards Scholarship biasanya ditutup akhir April. Pastikan dokumen SKL, IELTS, dan esai sudah diunggah.</p>
                            <a href="https://www.australiaawardsindonesia.org/" target="_blank" class="text-purple-400 text-sm hover:underline"><i class="fas fa-external-link-alt text-xs mr-1"></i> Website AAS Indonesia</a>
                        </div>
                        <div>
                            <h3 class="text-lg font-semibold text-emerald-400 mb-2">Jalur Karir</h3>
                            <p class="text-sm mb-3">Poles CV dan GitHub. Tonjolkan stack modern (Laravel, SvelteKit, Docker) dan pengalaman (PERNEFRI, BSM Cruise).</p>
                            <a href="https://www.kalibrr.id/" target="_blank" class="text-emerald-400 text-sm hover:underline block"><i class="fas fa-external-link-alt text-xs mr-1"></i> Cari Lowongan di Kalibrr</a>
                            <a href="https://www.techinasia.com/jobs" target="_blank" class="text-emerald-400 text-sm hover:underline block mt-1"><i class="fas fa-external-link-alt text-xs mr-1"></i> Tech in Asia Jobs</a>
                        </div>
                    </div>
                `
            },
            {
                id: 5,
                date: "26 Mei 2027",
                title: "Wisuda & LoA Hunting",
                category: "akademik",
                icon: "fa-graduation-cap",
                color: "bg-blue-500",
                textColor: "text-blue-400",
                summary: "Perayaan kelulusan dan mendaftar ke universitas tujuan.",
                details: `
                    <h3 class="text-lg font-semibold text-white">Selamat Wisuda! 🎉</h3>
                    <p class="mb-4">Ijazah dan Transkrip Nilai final kini di tangan. Ini adalah tiket utama untuk administrasi.</p>
                    <ul class="list-disc pl-5 space-y-2 mb-4">
                        <li>Fokus mendaftar ke universitas S2 tujuan untuk mendapatkan LoA (Letter of Acceptance) Unconditional.</li>
                        <li>LoA ini akan sangat memperkuat peluang lulus LPDP Tahap 2.</li>
                    </ul>
                `
            },
            {
                id: 6,
                date: "Juni - Agustus 2027",
                title: "Eksekusi LPDP, CPNS & Tech Jobs",
                category: "karir",
                icon: "fa-rocket",
                color: "bg-emerald-500",
                textColor: "text-emerald-400",
                summary: "Mendaftar LPDP Tahap 2, memantau formasi CPNS, dan apply kerja.",
                details: `
                    <h3 class="text-lg font-semibold text-white mb-2">Tiga Front Sekaligus:</h3>
                    
                    <div class="space-y-4">
                        <div class="p-3 bg-gray-700/50 rounded-lg border-l-4 border-purple-500">
                            <h4 class="font-bold text-purple-400">1. LPDP Tahap 2</h4>
                            <p class="text-sm">Gunakan LoA dan Ijazah untuk mendaftar. <a href="https://lpdp.kemenkeu.go.id/" target="_blank" class="underline">Link LPDP</a></p>
                        </div>
                        
                        <div class="p-3 bg-gray-700/50 rounded-lg border-l-4 border-emerald-500">
                            <h4 class="font-bold text-emerald-400">2. Tech Jobs Jakarta (Gaji 10 Juta)</h4>
                            <p class="text-sm">Apply untuk posisi Mid-Level Full-Stack Developer atau DevOps Engineer.</p>
                        </div>

                        <div class="p-3 bg-gray-700/50 rounded-lg border-l-4 border-yellow-500">
                            <h4 class="font-bold text-yellow-400">3. CPNS (Pranata Komputer)</h4>
                            <p class="text-sm">Pantau pembukaan SSCASN. Incar Kementerian Pusat (Kemenkeu/BPK) untuk Tukin tinggi. <br>
                            <a href="https://sscasn.bkn.go.id/" target="_blank" class="text-yellow-400 hover:underline"><i class="fas fa-external-link-alt text-xs mr-1"></i> Portal SSCASN BKN</a></p>
                        </div>
                    </div>
                `
            }
        ];

        const container = document.getElementById('timeline-container');
        const filterBtns = document.querySelectorAll('.filter-btn');

        function renderTimeline(filter = 'all') {
            container.innerHTML = '';
            
            const filteredData = timelineData.filter(item => filter === 'all' || item.category === filter || (item.id === 4 && (filter === 'beasiswa' || filter === 'karir')));

            filteredData.forEach((item, index) => {
                const isLeft = index % 2 === 0;
                
                // Color maps for badges
                const badgeColors = {
                    akademik: 'bg-blue-900 text-blue-300',
                    beasiswa: 'bg-purple-900 text-purple-300',
                    karir: 'bg-emerald-900 text-emerald-300'
                };
                let badgeClass = badgeColors[item.category] || 'bg-gray-700 text-gray-300';
                let catLabel = item.category;
                if(item.id === 4) { badgeClass = 'bg-gray-800 text-gray-300'; catLabel = 'Beasiswa & Karir'; }

                const html = `
                    <div class="relative flex md:justify-between items-center w-full mb-12 group cursor-pointer" onclick="openModal(${item.id})">
                        <!-- Connector Dot -->
                        <div class="absolute left-[24px] md:left-1/2 transform md:-translate-x-1/2 -translate-x-1/2 w-8 h-8 rounded-full ${item.color} flex items-center justify-center border-4 border-[#0f172a] shadow-[0_0_15px_rgba(0,0,0,0.5)] z-10 transition-transform group-hover:scale-110">
                            <i class="fas ${item.icon} text-white text-xs"></i>
                        </div>

                        <!-- Card Container -->
                        <div class="w-full pl-16 md:pl-0 md:w-[45%] ${isLeft ? 'md:pr-12 md:text-right' : 'md:pl-12 md:ml-auto text-left'}">
                            <div class="bg-gray-800 p-5 rounded-xl border border-gray-700 shadow-lg hover:border-gray-500 transition-colors">
                                <span class="text-xs font-bold uppercase tracking-wider px-2 py-1 rounded ${badgeClass} inline-block mb-2">${catLabel}</span>
                                <p class="${item.textColor} font-semibold text-sm mb-1">${item.date}</p>
                                <h3 class="text-xl font-bold text-white mb-2 group-hover:text-gray-200 transition-colors">${item.title}</h3>
                                <p class="text-gray-400 text-sm leading-relaxed">${item.summary}</p>
                                <div class="mt-3 text-xs text-gray-500 font-medium flex items-center ${isLeft ? 'md:justify-end' : ''}">
                                    Klik untuk detail <i class="fas fa-chevron-right ml-1 text-[10px]"></i>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += html;
            });

            // Trigger reflow to animate
            requestAnimationFrame(() => {
                const cards = container.querySelectorAll('.w-full');
                cards.forEach((card, i) => {
                    card.style.opacity = '0';
                    card.style.transform = 'translateY(20px)';
                    card.style.transition = `opacity 0.5s ease ${i * 0.1}s, transform 0.5s ease ${i * 0.1}s`;
                    requestAnimationFrame(() => {
                        card.style.opacity = '1';
                        card.style.transform = 'translateY(0)';
                    });
                });
            });
        }

        filterBtns.forEach(btn => {
            btn.addEventListener('click', (e) => {
                const filter = e.target.dataset.filter;
                
                // Update active state
                filterBtns.forEach(b => {
                    b.classList.remove('ring-2', 'ring-gray-400');
                    if (b.dataset.filter === 'all') {
                        b.classList.replace('bg-gray-700', 'bg-gray-800');
                        b.classList.replace('text-white', 'text-gray-300');
                    } else {
                        b.classList.remove('bg-blue-600/20', 'bg-purple-600/20', 'bg-emerald-600/20');
                    }
                });

                if (filter === 'all') {
                    btn.classList.add('ring-2', 'ring-gray-400');
                    btn.classList.replace('bg-gray-800', 'bg-gray-700');
                    btn.classList.replace('text-gray-300', 'text-white');
                } else {
                    const color = btn.dataset.filter === 'akademik' ? 'blue' : btn.dataset.filter === 'beasiswa' ? 'purple' : 'emerald';
                    btn.classList.add(`bg-${color}-600/20`);
                }

                renderTimeline(filter);
            });
        });

        const modalBackdrop = document.getElementById('modal-backdrop');
        const modalContent = document.getElementById('modal-content');
        const btnClose = document.getElementById('close-modal');

        function openModal(id) {
            const data = timelineData.find(item => item.id === id);
            if(!data) return;

            document.getElementById('modal-title').textContent = data.title;
            document.getElementById('modal-date').textContent = data.date;
            
            const badgeColors = {
                akademik: 'bg-blue-900 text-blue-300',
                beasiswa: 'bg-purple-900 text-purple-300',
                karir: 'bg-emerald-900 text-emerald-300'
            };
            let catLabel = data.category;
            let badgeClass = badgeColors[data.category] || 'bg-gray-700 text-gray-300';
            if(data.id === 4) { badgeClass = 'bg-gray-800 text-gray-300'; catLabel = 'Beasiswa & Karir'; }
            
            const catElem = document.getElementById('modal-category');
            catElem.textContent = catLabel;
            catElem.className = `text-xs font-bold uppercase tracking-wider px-3 py-1 rounded-full mb-2 inline-block ${badgeClass}`;

            document.getElementById('modal-body').innerHTML = data.details;

            modalBackdrop.classList.remove('hidden');
            // Small delay to allow display:block to apply before animating opacity
            setTimeout(() => {
                modalBackdrop.classList.remove('opacity-0');
                modalBackdrop.classList.add('opacity-100');
                modalContent.classList.remove('scale-95');
                modalContent.classList.add('scale-100');
            }, 10);
            
            document.body.style.overflow = 'hidden'; // Prevent scrolling
        }

        function closeModal() {
            modalBackdrop.classList.remove('opacity-100');
            modalBackdrop.classList.add('opacity-0');
            modalContent.classList.remove('scale-100');
            modalContent.classList.add('scale-95');
            
            setTimeout(() => {
                modalBackdrop.classList.add('hidden');
                document.body.style.overflow = '';
            }, 300); // match transition duration
        }

        btnClose.addEventListener('click', closeModal);
        modalBackdrop.addEventListener('click', (e) => {
            if (e.target === modalBackdrop) closeModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && !modalBackdrop.classList.contains('hidden')) closeModal();
        });

        // Init
        renderTimeline('all');
    </script>
</body>
</html>
